name: deploy systems observatory

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PDF runtime
        run: python3 -m pip install -r requirements-build.txt
      - name: Generate and build
        run: npm run build
      - name: Point /lab/ at the realtime relay
        if: ${{ vars.LAB_RELAY_URL != '' }}
        env:
          RELAY: ${{ vars.LAB_RELAY_URL }}
        run: |
          if ! [[ "$RELAY" =~ ^wss://[A-Za-z0-9.-]+$ ]]; then
            echo "::warning::LAB_RELAY_URL should look like wss://obr-relay.<subdomain>.workers.dev; skipping."
            exit 0
          fi
          mkdir -p dist/lab/data
          printf '{"url":"%s"}\n' "$RELAY" > dist/lab/data/relay.json
          sed -i "s|<meta name=\"obr-relay\" content=\"\">|<meta name=\"obr-relay\" content=\"$RELAY\">|" dist/lab/royale/index.html
          grep -q "$RELAY" dist/lab/royale/index.html && echo "relay → $RELAY"
      - name: Snapshot GitHub activity for /lab/
        run: node scripts/lab-live.mjs dist/lab/data/live.json
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
