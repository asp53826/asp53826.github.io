name = "obr-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# One Durable Object per room, SQLite-backed (available on the free plan).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Pages allowed to open sockets, comma-separated. Add a custom domain here if you set one up.
ALLOWED_ORIGINS = "https://asp53826.github.io"
